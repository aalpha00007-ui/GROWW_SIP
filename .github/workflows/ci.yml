# CI and the AI eval gate (PRD §7, architecture §8). Render deploys only after this passes
# ("Auto-Deploy: After CI Checks Pass"), so a version that fails the eval never goes live.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The "Run workflow" button on the Actions tab: always runs the eval.
  workflow_dispatch:

# One run at a time per branch, so two evals never share Groq's free tokens a minute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Typecheck, tests and data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:check
      - run: npm run chunks:check

  eval:
    name: AI eval gate
    needs: checks
    # Pull requests from forks get no secrets, so they cannot run the eval.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Groq's free plan caps tokens a day and one eval uses about a fifth of them, so the eval runs only
      # when something that changes the AI's behaviour changed: code, data, the schema or this workflow.
      # "[run eval]" in the commit message runs it anyway, for a re-run from the terminal.
      - name: Did the AI change?
        id: changes
        env:
          # Through env, never pasted into the script: a commit message must not be able to run commands.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s' "$HEAD_MESSAGE" | grep -qF '[run eval]'; then
            echo "The commit message asks for the eval."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: running the eval."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^(src/(pipeline|llm|eval|db)/|data/|\.github/workflows/|package(-lock)?\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Eval skipped
        if: steps.changes.outputs.run != 'true'
        run: echo "No AI files changed (only docs, tests or screens), so the eval is skipped."

      - name: Check the secrets are set
        if: steps.changes.outputs.run == 'true'
        env:
          # Only true or false, never a value: spots a key saved under Variables instead of Secrets.
          IN_VARS_DATABASE_URL: ${{ vars.DATABASE_URL != '' }}
          IN_VARS_MISTRAL_API_KEY: ${{ vars.MISTRAL_API_KEY != '' }}
          IN_VARS_GROQ_API_KEY: ${{ vars.GROQ_API_KEY != '' }}
        run: |
          missing=0
          for name in DATABASE_URL MISTRAL_API_KEY GROQ_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name is set"; continue; fi
            missing=1
            in_vars="IN_VARS_$name"
            if [ "${!in_vars}" = "true" ]; then
              echo "::error::$name is saved under Variables, not Secrets. Add it on the Secrets tab (Settings > Secrets and variables > Actions), then delete the variable."
            else
              echo "::error::The repository secret $name is missing or empty (Settings > Secrets and variables > Actions > Secrets tab)."
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.changes.outputs.run == 'true'
        run: npm ci

      - name: Neon holds the seed
        if: steps.changes.outputs.run == 'true'
        run: npm run db:verify

      - name: Eval (exits 1 when the gate fails)
        if: steps.changes.outputs.run == 'true'
        run: npm run eval
